name: Build FlowBoard

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test core logic
        run: dotnet test tests/FlowBoard.Tests/FlowBoard.Tests.csproj -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/FlowBoard/FlowBoard.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FlowBoard-win-x64
          path: publish/FlowBoard.exe
